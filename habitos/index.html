<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Racha">
<title>Racha Hábitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: una columna de app móvil (máx. 520px), barra de estado arriba, navegación fija abajo con botón central elevado. Diseño oscuro deliberado, acento amarillo. */
:root {
  --bg: #0b0b0a;
  --surface: #141412;
  --surface-2: #1c1b18;
  --line: #2b2925;
  --fg: #f4f1e8;
  --muted: #8f8b7f;
  --accent: #f5c518;
  --accent-ink: #1a1500;
  --accent-dim: #3a2f07;
  --heart: #ef4444;
  --flame: #ff8a3d;
  --good: #4ade80;
  --font-display: "Archivo", "Arial Black", system-ui, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 28px;
  --r-md: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app {
  max-width: 520px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 12px calc(110px + env(safe-area-inset-bottom, 0px));
}

/* Barra superior */
.status {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px 10px 10px;
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
}
.avatar {
  position: relative;
  flex: none;
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 2px solid var(--line);
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-weight: 900;
  font-stretch: 115%;
  color: var(--fg);
  background: var(--surface);
}
.avatar .lv {
  position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: var(--accent-ink);
  font-size: 10px; font-weight: 900; letter-spacing: .04em;
  padding: 1px 7px; border-radius: 999px; white-space: nowrap;
}
.stat { display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 17px; }
.stat svg { width: 20px; height: 20px; }
.stat.xp { color: var(--accent); }
.stat.flame { color: var(--flame); }
.stat.coin {
  border: 2px solid var(--accent-dim); background: #1f1904;
  border-radius: 999px; padding: 4px 10px; color: var(--fg);
}
.stat.coin svg { color: var(--accent); }
.status .spacer { flex: 1; }
.icon-btn {
  background: none; border: 0; padding: 6px; color: var(--fg); border-radius: 50%;
  display: grid; place-items: center;
}
.icon-btn svg { width: 24px; height: 24px; }

/* Encabezado de pantalla */
.page-head { display: flex; align-items: center; gap: 16px; margin: 36px 0 24px; }
.page-head .badge {
  flex: none; width: 60px; height: 60px; border-radius: 20px;
  border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; color: var(--accent);
}
.page-head .badge svg { width: 30px; height: 30px; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 900; font-stretch: 112%;
  font-size: clamp(30px, 8vw, 40px);
  line-height: 1; letter-spacing: -.01em;
  text-wrap: balance;
}
.sub {
  margin: 6px 0 0;
  color: var(--muted);
  font-weight: 800; font-stretch: 110%;
  text-transform: uppercase; letter-spacing: .06em; font-size: 13px;
}
h2 {
  display: flex; align-items: center; gap: 12px;
  margin: 32px 0 14px;
  font-family: var(--font-display);
  font-weight: 900; font-stretch: 112%;
  font-size: 20px; text-transform: uppercase; letter-spacing: .02em;
}
h2::before { content: ""; width: 7px; height: 26px; border-radius: 4px; background: #c9a10c; }
h2 .count { margin-left: auto; color: var(--muted); font-size: 14px; font-stretch: 100%; }

/* Píldoras / tabs */
.pills { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.pills::-webkit-scrollbar { display: none; }
.pill {
  flex: none; display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: 16px;
  border: 2px solid var(--line); background: var(--surface);
  color: var(--muted);
  font-weight: 900; font-stretch: 110%; text-transform: uppercase; letter-spacing: .06em; font-size: 13px;
}
.pill[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }

/* Tarjetas */
.card {
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--r-lg);
  padding: 20px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 22px; border-radius: 18px;
  border: 2px solid var(--line); background: var(--surface-2);
  font-weight: 900; font-stretch: 112%; text-transform: uppercase; letter-spacing: .05em; font-size: 14px;
}
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--heart); }
.btn.danger.armed { background: var(--heart); color: #fff; border-color: var(--heart); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.block { width: 100%; }
.hint { color: var(--muted); font-size: 13px; font-weight: 600; margin: 10px 0 0; }

/* Resumen de hoy */
.today {
  display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center;
}
.ring { width: 112px; height: 112px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--accent); transition: stroke-dashoffset .5s ease; }
.ring .label {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  font-family: var(--font-display); font-weight: 900; font-stretch: 115%; font-size: 26px; line-height: 1;
}
.ring .label small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; margin-top: 4px; }
.today-copy { min-width: 0; }
.today-copy .big { font-family: var(--font-display); font-weight: 900; font-stretch: 112%; font-size: 22px; line-height: 1.1; }
.xpbar { margin-top: 14px; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s ease; }
.xpmeta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; text-transform: uppercase; letter-spacing: .05em; }

.banner {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  margin-top: 16px; padding: 12px 16px; border-radius: var(--r-md);
  border: 2px dashed var(--accent-dim); color: var(--muted); font-size: 13px; font-weight: 600;
}
.banner b { color: var(--accent); }
.banner .btn { padding: 8px 14px; font-size: 12px; margin-left: auto; }

/* Lista de hábitos */
.list { display: grid; gap: 12px; }
.habit {
  display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: center;
  padding: 14px 14px 14px 14px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 22px;
  transition: border-color .2s, background .2s;
}
.habit .hi {
  width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center;
  background: var(--surface-2); color: var(--fg); border: 2px solid var(--line);
}
.habit .hi svg { width: 24px; height: 24px; }
.habit .meta { min-width: 0; }
.habit .name { font-weight: 800; font-size: 16px; overflow-wrap: anywhere; }
.habit .tags { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 3px; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-variant-numeric: tabular-nums; }
.habit .tags .fl { color: var(--flame); }
.check {
  width: 52px; height: 52px; border-radius: 18px;
  border: 2px solid var(--line); background: var(--bg); color: var(--muted);
  display: grid; place-items: center;
  transition: transform .15s ease, background .2s, color .2s, border-color .2s;
}
.check svg { width: 26px; height: 26px; }
.check:active { transform: scale(.92); }
.habit.done { border-color: var(--accent-dim); background: #17140a; }
.habit.done .hi { color: var(--accent); border-color: var(--accent-dim); }
.habit.done .check { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.habit.done .name { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
.edit { background: none; border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; color: var(--muted); font-weight: 900; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.empty { text-align: center; color: var(--muted); padding: 28px 16px; font-weight: 600; }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-weight: 900; font-stretch: 112%; font-size: 18px; margin-bottom: 6px; text-transform: uppercase; }

/* Retos */
.quest { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; }
.quest + .quest { margin-top: 12px; }
.quest .qt { font-weight: 800; font-size: 16px; }
.quest .qk { font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.quest .qbar { grid-column: 1 / -1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.quest .qbar i { display: block; height: 100%; background: var(--accent); }
.quest .qr { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; text-transform: uppercase; letter-spacing: .05em; }
.quest .btn { padding: 10px 14px; font-size: 12px; }
.quest.claimed { opacity: .5; }

/* Progreso */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kpi { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 14px; min-width: 0; }
.kpi b { display: block; font-family: var(--font-display); font-weight: 900; font-stretch: 115%; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi span { font-size: 11px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.heat-wrap { overflow-x: auto; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; width: max-content; }
.heat i { width: 16px; height: 16px; border-radius: 5px; background: var(--surface-2); }
.heat i[data-l="1"] { background: #4a3c08; }
.heat i[data-l="2"] { background: #8a6f0c; }
.heat i[data-l="3"] { background: #c9a10c; }
.heat i[data-l="4"] { background: var(--accent); }
.heat i.fz { background: #1b3a52; }
.heat i.future { background: transparent; border: 1px dashed var(--line); }
.legend { display: flex; gap: 6px; align-items: center; margin-top: 12px; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; flex-wrap: wrap; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.row .rn { font-weight: 800; min-width: 0; overflow-wrap: anywhere; }
.row .rv { font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .rb { grid-column: 1 / -1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.row .rb i { display: block; height: 100%; background: var(--accent); }

/* Ajustes */
.field { display: grid; gap: 8px; margin-bottom: 18px; }
.field label, .field .lbl { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.input, textarea {
  width: 100%; padding: 14px 16px; border-radius: 16px;
  border: 2px solid var(--line); background: var(--bg); color: var(--fg);
  font-weight: 600;
}
textarea { min-height: 120px; font-size: 12px; font-family: ui-monospace, Menlo, monospace; resize: vertical; }
.input:focus, textarea:focus { border-color: var(--accent); outline: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* Hoja modal */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto;
  background: var(--surface); border: 2px solid var(--line); border-bottom: 0;
  border-radius: 30px 30px 0 0;
  padding: 22px 16px calc(22px + env(safe-area-inset-bottom, 0px));
  animation: up .25s ease;
}
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.sheet h3 { margin: 0 0 18px; font-family: var(--font-display); font-weight: 900; font-stretch: 112%; font-size: 24px; text-transform: uppercase; }
.choices { display: flex; gap: 8px; flex-wrap: wrap; }
.choice {
  border: 2px solid var(--line); background: var(--bg); color: var(--muted);
  border-radius: 14px; padding: 10px 12px; font-weight: 900; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: .04em;
}
.choice svg { width: 22px; height: 22px; }
.choice[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.choice.day { width: 42px; justify-content: center; padding: 10px 0; }

/* Navegación inferior */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--bg); border-top: 2px solid var(--line);
  padding: 8px 8px calc(10px + env(safe-area-inset-bottom, 0px));
}
.nav-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.nav button {
  background: none; border: 0; color: var(--muted);
  display: grid; justify-items: center; gap: 4px; padding: 6px 0;
  font-weight: 800; font-size: 12px; position: relative;
}
.nav button svg { width: 26px; height: 26px; }
.nav button[aria-current="page"] { color: var(--fg); }
.nav button[aria-current="page"]::after { content: ""; position: absolute; bottom: -8px; width: 34px; height: 4px; border-radius: 4px; background: var(--muted); }
.nav .center .orb {
  width: 64px; height: 64px; margin-top: -30px; border-radius: 50%;
  background: var(--surface-2); border: 2px solid var(--line);
  display: grid; place-items: center; color: var(--fg);
}
.nav .center[aria-current="page"] .orb { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.nav .center[aria-current="page"]::after { display: none; }

.toast {
  position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  z-index: 30; background: var(--accent); color: var(--accent-ink);
  padding: 10px 18px; border-radius: 999px; font-weight: 900; font-size: 14px;
  text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
  animation: pop .3s ease;
}
@keyframes pop { from { transform: translate(-50%, 10px) scale(.9); opacity: 0; } }

/* Grupo */
.member { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; }
.member + .member { margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--line); }
.member .pos { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 2px solid var(--line); font-weight: 900; font-stretch: 115%; font-size: 13px; }
.member.me .pos { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.member .mn { font-weight: 800; min-width: 0; overflow-wrap: anywhere; }
.member .ms { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-variant-numeric: tabular-nums; }
.member .ms .fl { color: var(--flame); }
.member .mw { text-align: right; font-family: var(--font-display); font-weight: 900; font-stretch: 115%; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1; }
.member .mw small { display: block; font-family: var(--font-body); font-size: 10px; color: var(--muted); letter-spacing: .08em; margin-top: 4px; }
.goal + .goal { margin-top: 18px; padding-top: 18px; border-top: 2px solid var(--line); }
.goal-top { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; }
.goal-top .hi { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-dim); color: var(--accent); }
.goal-top .hi svg { width: 22px; height: 22px; }
.goal .gt { font-weight: 800; font-size: 16px; overflow-wrap: anywhere; }
.goal .btn { padding: 10px 14px; font-size: 12px; }
.dots { margin-top: 12px; display: grid; gap: 6px; }
.dots .dr { display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, 18px); gap: 4px; align-items: center; font-size: 12px; font-weight: 800; color: var(--muted); }
.dots .dr span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dots .dr.me span:first-child { color: var(--fg); }
.dots i { width: 18px; height: 18px; border-radius: 5px; background: var(--surface-2); display: grid; place-items: center; font-style: normal; font-size: 9px; color: var(--muted); }
.dots i.on { background: var(--accent); }
.dots i.off { background: transparent; border: 1px dashed var(--line); }
.dots .hd i { background: transparent; }

@media (max-width: 400px) {
  .status { gap: 10px; }
  .stat { font-size: 15px; }
  .today { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .today-copy { width: 100%; }
  .kpi b { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* Acceso */
body.gate .status, body.gate .nav { display: none; }
.login { min-height: 78vh; display: grid; align-content: center; gap: 28px; padding-block: 24px; }
.login .mark { width: 76px; height: 76px; border-radius: 26px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.login .mark svg { width: 40px; height: 40px; stroke-width: 2.6; }
.login h1 { font-size: clamp(40px, 12vw, 58px); text-transform: uppercase; }
.login p { margin: 0; color: var(--muted); font-weight: 600; max-width: 34ch; }
.gbtn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 16px 20px; border-radius: 18px; border: 2px solid var(--fg); background: var(--fg); color: #111; font-weight: 900; font-size: 15px; letter-spacing: .02em; }
.gbtn svg { width: 22px; height: 22px; }
.gbtn:disabled { opacity: .5; }
.login .err { color: var(--heart); font-weight: 700; font-size: 13px; }
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.member .pos img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.member .pos { overflow: hidden; }
.code { font-family: var(--font-display); font-weight: 900; font-stretch: 125%; font-size: 34px; letter-spacing: .12em; color: var(--accent); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stepper { display: inline-flex; align-items: center; gap: 14px; }
.stepper button { width: 46px; height: 46px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); font-weight: 900; font-size: 22px; }
.stepper b { font-family: var(--font-display); font-weight: 900; font-stretch: 115%; font-size: 26px; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; justify-content: center; }
.mode { font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header class="status" aria-label="Tu estado">
    <div class="avatar" id="avatar"><span id="initials">TU</span><span class="lv" id="lv">LV 1</span></div>
    <span class="stat xp" title="Experiencia total"><svg data-i="star"></svg><span id="xpTotal">0</span></span>
    <span class="stat flame" title="Racha de días"><svg data-i="flame"></svg><span id="streakTop">0</span></span>
    <span class="stat coin" title="Monedas"><svg data-i="coin"></svg><span id="coinsTop">0</span></span>
    <span class="spacer"></span>
    <button class="icon-btn" data-go="ajustes" aria-label="Ajustes"><svg data-i="gear"></svg></button>
  </header>
  <main id="view"></main>
</div>

<nav class="nav" aria-label="Secciones">
  <div class="nav-in">
    <button data-go="habitos"><svg data-i="list"></svg>Hábitos</button>

const GOOGLE_G = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.2-2.1 3.5-5.1 3.5-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"/></svg>';
const HABIT_ICONS = ["book", "run", "water", "moon", "leaf", "brain", "dumbbell", "pen", "phone", "wallet"];
function icon(name) {

}

/* ---------- Fechas ---------- */
const WD = ["D", "L", "M", "X", "J", "V", "S"];
function key(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fromKey(k) { const p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function today() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function weekStart(d) { const r = new Date(d); r.setDate(r.getDate() - (r.getDay() + 6) % 7); return r; }
function monthStart(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }

/* ---------- Estado ---------- */
const STORE = "racha-habitos-v1";
const DIFF = { 10: "Fácil", 20: "Media", 30: "Difícil" };
const SUGGESTIONS = [
  { name: "Leer 20 minutos", icon: "book", freq: "days", days: [0, 1, 2, 3, 4, 5, 6], xp: 20 },
  { name: "Beber 2 L de agua", icon: "water", freq: "days", days: [0, 1, 2, 3, 4, 5, 6], xp: 10 },
  { name: "Entrenar", icon: "dumbbell", freq: "week", times: 3, xp: 30 },
  { name: "Dormir antes de las 23:30", icon: "moon", freq: "days", days: [0, 1, 2, 3, 4], xp: 20 },
  { name: "Revisar mis gastos", icon: "wallet", freq: "month", times: 4, xp: 20 }
];
let state;

function uid() { return Math.random().toString(36).slice(2, 9); }

function exampleState() {
  const habits = SUGGESTIONS.map(function (s) { return Object.assign({ id: uid() }, s, { days: s.days ? s.days.slice() : [] }); });
  const log = {}, t = today();
  let seed = 7;
  function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (let i = 42; i >= 1; i--) {
    const d = addDays(t, -i), p = 0.45 + (42 - i) / 42 * 0.45;
    const done = habits.filter(function (h) {
      if (h.freq === "days") return h.days.includes(d.getDay()) && rnd() < p;
      return rnd() < (h.freq === "week" ? h.times / 7 : h.times / 30) * 1.1;
    }).map(function (h) { return h.id; });
    if (done.length) log[key(d)] = done;
  }
  for (let i = 1; i <= 9; i++) { const k = key(addDays(t, -i)); if (!log[k] || !log[k].length) log[k] = [habits[1].id]; }
  log[key(t)] = [habits[1].id];
  return { v: 1, name: "", habits: habits, log: log, bonusXp: 60, coins: 45, freezes: 1, frozen: [], claimed: {}, example: true, groupId: null, savedAt: 0 };
}
function emptyState(prev) {
  prev = prev || {};
  return { v: 1, name: prev.name || "", habits: [], log: {}, bonusXp: 0, coins: 0, freezes: 0, frozen: [], claimed: {}, example: false, groupId: prev.groupId || null, savedAt: 0 };
}
function normalize(s) {
  const st = Object.assign(emptyState(), s);
  st.habits = st.habits.map(function (h) {
    const f = h.freq === "week" || h.freq === "month" ? h.freq : "days";
    return Object.assign({}, h, { freq: f, days: Array.isArray(h.days) ? h.days : [0, 1, 2, 3, 4, 5, 6], times: h.times || 1 });
  });
  return st;
}
function storeKey() { return session.uid ? STORE + ":" + session.uid : STORE; }
function readLocal() {
  try {
    const raw = localStorage.getItem(storeKey());
    if (raw) { const s = JSON.parse(raw); if (s && s.v === 1 && Array.isArray(s.habits)) return normalize(s); }
  } catch (e) { /* almacenamiento no disponible */ }
  return null;
}
function writeLocal() { try { localStorage.setItem(storeKey(), JSON.stringify(state)); } catch (e) { /* sin persistencia */ } }
function save() { state.savedAt = Date.now(); writeLocal(); scheduleSync(); }

/* ---------- Frecuencias ---------- */
function habitById(id) { return state.habits.find(function (h) { return h.id === id; }); }
function doneOn(k) { return state.log[k] || []; }
function isDone(h, k) { return doneOn(k).includes(h.id); }
function pStart(h, d) { return h.freq === "week" ? weekStart(d) : monthStart(d); }
function countRange(h, from, to) {
  let n = 0;
  for (let d = new Date(from); d <= to; d = addDays(d, 1)) if (isDone(h, key(d))) n++;
  return n;
}
// ¿Toca este hábito el día d? Semanales y mensuales tocan hasta cumplir la meta del periodo.
function isDue(h, d) {
  if (h.freq === "days") return h.days.includes(d.getDay());
  if (isDone(h, key(d))) return true;
  const start = pStart(h, d);
  return d <= start ? true : countRange(h, start, addDays(d, -1)) < h.times;
}
function dueOn(d) { return state.habits.filter(function (h) { return isDue(h, d); }); }
function periodCount(h) { const t = today(); return countRange(h, pStart(h, t), t); }
function freqLabel(h) {
  if (h.freq === "week") return h.times + "× semana";
  if (h.freq === "month") return h.times + "× mes";
  return h.days.length === 7 ? "Diario" : [1, 2, 3, 4, 5, 6, 0].filter(function (d) { return h.days.includes(d); }).map(function (d) { return WD[d]; }).join(" ");
}

/* ---------- Cálculos ---------- */
function totalXp() {
  let xp = state.bonusXp || 0;
  Object.keys(state.log).forEach(function (k) {
    state.log[k].forEach(function (id) { const h = habitById(id); xp += h ? h.xp : 10; });
  });
  return xp;
}
// Nivel n requiere 50·n·(n-1) XP acumulada: 0, 100, 300, 600, 1000...
function levelInfo(xp) {
  let n = 1;
  while (50 * (n + 1) * n <= xp) n++;
  const base = 50 * n * (n - 1), next = 50 * (n + 1) * n;
  return { level: n, into: xp - base, need: next - base };
}
function dayActive(k) { return doneOn(k).length > 0 || state.frozen.includes(k); }
function globalStreak() {
  let d = today();
  if (!dayActive(key(d))) d = addDays(d, -1);
  let n = 0;
  while (dayActive(key(d)) && n < 3650) { n++; d = addDays(d, -1); }
  return n;
}
// Racha de un hábito: días programados seguidos, o semanas/meses seguidos cumpliendo la meta.
function habitStreak(h) {
  let d = today(), n = 0, guard = 0;
  if (h.freq !== "days") {
    if (countRange(h, pStart(h, d), d) >= h.times) n++;
    d = addDays(pStart(h, d), -1);
    while (guard++ < 600 && countRange(h, pStart(h, d), d) >= h.times) { n++; d = addDays(pStart(h, d), -1); }
    return n;
  }
  if (!isDone(h, key(d))) d = addDays(d, -1);
  while (guard++ < 3650) {
    const k = key(d);
    if (h.days.includes(d.getDay())) { if (isDone(h, k) || state.frozen.includes(k)) n++; else break; }
    d = addDays(d, -1);
  }
  return n;
}
function streakLabel(h, n) {
  if (h.freq === "week") return "Racha " + n + " sem";
  if (h.freq === "month") return "Racha " + n + (n === 1 ? " mes" : " meses");
  return "Racha " + n;
}
function bestStreak() {
  const keys = Object.keys(state.log).concat(state.frozen).sort();
  if (!keys.length) return 0;
  let best = 0, cur = 0;
  for (let d = fromKey(keys[0]), end = today(); d <= end; d = addDays(d, 1)) {
    if (dayActive(key(d))) { cur++; best = Math.max(best, cur); } else cur = 0;
  }
  return best;
}
function rate(h, days) {
  const t = today();
  if (h.freq !== "days") {
    const expected = h.times * days / (h.freq === "week" ? 7 : 30);
    return Math.min(1, countRange(h, addDays(t, -(days - 1)), t) / expected);
  }
  let sched = 0, done = 0;
  for (let i = 0; i < days; i++) {
    const d = addDays(t, -i);
    if (h.days.includes(d.getDay())) { sched++; if (isDone(h, key(d))) done++; }
  }
  return sched ? done / sched : 0;
}

/* ---------- Retos ---------- */
function quests() {
  const t = today(), tk = key(t), wk = key(weekStart(t));
  const due = dueOn(t), doneToday = due.filter(function (h) { return isDone(h, tk); }).length;
  let weekCount = 0;
  for (let d = weekStart(t); d <= t; d = addDays(d, 1)) weekCount += doneOn(key(d)).length;
  const streak = globalStreak();
  return [
    { id: "d3", kind: "Diario", period: tk, title: "Completa 3 hábitos hoy", cur: doneToday, goal: 3, xp: 20, coins: 5 },
    { id: "dall", kind: "Diario", period: tk, title: "Día perfecto: todos los de hoy", cur: doneToday, goal: Math.max(due.length, 1), xp: 40, coins: 10 },
    { id: "w15", kind: "Semanal", period: wk, title: "15 hábitos esta semana", cur: weekCount, goal: 15, xp: 60, coins: 15 },
    { id: "s7", kind: "Hito", period: "once", title: "Racha de 7 días", cur: streak, goal: 7, xp: 100, coins: 25 },
    { id: "s30", kind: "Hito", period: "once", title: "Racha de 30 días", cur: streak, goal: 30, xp: 400, coins: 80 }
  ];
}
function claimKey(q) { return q.id + "@" + q.period; }

/* ---------- Nube: Firebase (login con Google + Firestore) ----------
   users/{uid}/private/state        tus hábitos e historial (solo tú)
   groups/{código}                  nombre del grupo y dueño
   groups/{código}/members/{uid}    tu resumen para el grupo (lo escribes solo tú)
   groups/{código}/goals/{id}       objetivos comunes                              */
const FB_VERSION = "10.12.2";
const session = { mode: firebaseConfig ? "cloud" : "local", phase: firebaseConfig ? "loading" : "ready", uid: null, user: null, error: "" };
const cloud = { fb: null, group: null, members: [], goals: [], unsub: [], error: "", watching: null };
let syncTimer = null, syncChain = Promise.resolve();

async function initFirebase() {
  const base = "https://www.gstatic.com/firebasejs/" + FB_VERSION + "/";
  const mods = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
  const app = mods[0].initializeApp(firebaseConfig);
  const A = mods[1], F = mods[2];
  const auth = A.getAuth(app), db = F.getFirestore(app);
  if (firebaseConfig.useEmulator) {
    A.connectAuthEmulator(auth, "http://127.0.0.1:9099", { disableWarnings: true });
    F.connectFirestoreEmulator(db, "127.0.0.1", 8080);
    // Solo para pruebas locales con el emulador: inicia sesión sin la ventana de Google.
    window.__rachaTestSignIn = function (email, name) {
      return A.signInWithCredential(auth, A.GoogleAuthProvider.credential(JSON.stringify({ sub: email, email: email, name: name, email_verified: true })));
    };
  }
  cloud.fb = { A: A, F: F, auth: auth, db: db };
  A.onAuthStateChanged(auth, function (user) {
    if (user) onSignedIn(user);
    else { session.uid = null; session.user = null; session.phase = "login"; stopGroup(); render(); }
  });
}
function fdoc(path) { return cloud.fb.F.doc(cloud.fb.db, path); }
function fcol(path) { return cloud.fb.F.collection(cloud.fb.db, path); }

async function signIn() {
  const A = cloud.fb.A, provider = new A.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  session.error = ""; session.phase = "signing"; render();
  try { await A.signInWithPopup(cloud.fb.auth, provider); }
  catch (e) {
    if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) {
      try { await A.signInWithRedirect(cloud.fb.auth, provider); return; } catch (e2) { e = e2; }
    }
    session.phase = "login";
    session.error = e && e.code === "auth/popup-closed-by-user" ? "" :
      e && e.code === "auth/unauthorized-domain" ? "Este dominio no está autorizado en Firebase. Añádelo en Authentication → Settings → Authorized domains." :
      "No se pudo iniciar sesión. Inténtalo otra vez.";
    render();
  }
}
async function onSignedIn(user) {
  session.uid = user.uid; session.user = user;
  const local = readLocal();
  state = local || emptyState({ name: user.displayName || "" });
  if (!state.name) state.name = user.displayName || "";
  session.phase = "ready"; render();
  try {
    const snap = await cloud.fb.F.getDoc(fdoc("users/" + user.uid + "/private/state"));
    if (snap.exists()) {
      const remote = normalize(JSON.parse(snap.data().json));
      if (!local || remote.savedAt > state.savedAt) { state = remote; writeLocal(); }
    } else if (local) pushNow();
  } catch (e) { cloud.error = "Sin conexión. Tus cambios se guardan en este teléfono y se subirán después."; }
  watchGroup(); render();
}
async function signOutNow() {
  stopGroup();
  await cloud.fb.A.signOut(cloud.fb.auth);
}

function memberDoc() {
  const t = today(), tk = key(t), due = dueOn(t);
  let week = 0;
  for (let d = weekStart(t); d <= t; d = addDays(d, 1)) week += doneOn(key(d)).length;
  const goalDays = {};
  state.habits.forEach(function (h) {
    if (!h.goalId) return;
    const days = [];
    for (let i = 0; i < 35; i++) { const k = key(addDays(t, -i)); if (isDone(h, k)) days.push(k); }
    goalDays[h.goalId] = days;
  });
  const xp = totalXp(), photo = session.user && session.user.photoURL;
  return {
    nick: (state.name || "Sin nombre").slice(0, 40), photo: photo && /^https:\/\//.test(photo) ? photo : "",
    level: levelInfo(xp).level, xp: xp, streak: globalStreak(), week: week, weekKey: key(weekStart(t)),
    todayKey: tk, todayDone: due.filter(function (h) { return isDone(h, tk); }).length, todayTotal: due.length,
    goalDays: goalDays, updatedAt: Date.now()
  };
}
function scheduleSync() {
  if (!cloud.fb || !session.uid) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushNow, 800);
}
function pushNow() {
  if (!cloud.fb || !session.uid) return;
  const F = cloud.fb.F, u = session.uid, json = JSON.stringify(state);
  const mdoc = state.groupId ? memberDoc() : null, gid = state.groupId;
  syncChain = syncChain.then(function () {
    const jobs = [F.setDoc(fdoc("users/" + u + "/private/state"), { json: json, savedAt: state.savedAt })];
    if (mdoc) jobs.push(F.setDoc(fdoc("groups/" + gid + "/members/" + u), mdoc));
    return Promise.all(jobs).then(function () { if (cloud.error) { cloud.error = ""; render(); } });
  }).catch(function () { cloud.error = "No se pudo guardar en la nube. Se reintentará con tu próximo cambio."; render(); });
}
function stopGroup() {
  cloud.unsub.forEach(function (f) { f(); });
  cloud.unsub = []; cloud.group = null; cloud.members = []; cloud.goals = []; cloud.watching = null;
}
function watchGroup() {
  if (!cloud.fb || !session.uid) return;
  if (cloud.watching === state.groupId) return;
  stopGroup();
  const gid = state.groupId;
  if (!gid) return;
  cloud.watching = gid;
  const F = cloud.fb.F;
  const err = function () { cloud.error = "No se pudo leer el grupo."; render(); };
  cloud.unsub.push(F.onSnapshot(fdoc("groups/" + gid), function (s) { cloud.group = s.exists() ? Object.assign({ id: s.id }, s.data()) : null; render(); }, err));
  cloud.unsub.push(F.onSnapshot(fcol("groups/" + gid + "/members"), function (q) {
    cloud.members = q.docs.map(function (d) { return Object.assign({ key: d.id }, d.data()); }); render();
  }, err));
  cloud.unsub.push(F.onSnapshot(fcol("groups/" + gid + "/goals"), function (q) {
    cloud.goals = q.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
      .sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    render();
  }, err));
}
function newCode() {
  const abc = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let c = "";
  const r = crypto.getRandomValues(new Uint32Array(8));
  for (let i = 0; i < 8; i++) c += abc[r[i] % abc.length];
  return c;
}
async function createGroup(name) {

async function joinGroup(code) {

    ? { name: src.name, icon: src.icon, freq: src.freq || "days", days: (src.days || [0, 1, 2, 3, 4, 5, 6]).slice(), times: src.times || 3, xp: src.xp }
    : { name: "", icon: "book", freq: "days", days: [0, 1, 2, 3, 4, 5, 6], times: 3, xp: 20 };
  const bg = $("#sheet");
  bg.className = "sheet-bg";
  bg.hidden = false;
  function maxTimes() { return draft.freq === "week" ? 6 : 30; }
  function draw() {
    const fq = [["days", "Días fijos"], ["week", "Por semana"], ["month", "Por mes"]];
    bg.innerHTML = '<form class="sheet" id="habitForm" role="dialog" aria-modal="true" aria-label="' + title + '">' +
      '<h3>' + title + '</h3>' + (asGoal ? '<p class="hint" style="margin:-8px 0 16px">Se añade a tus hábitos y tus amigos pueden unirse desde Grupo.</p>' : "") +
      '<div class="field"><label for="hName">Qué vas a hacer</label><input class="input" id="hName" maxlength="60" required placeholder="Ej.: Caminar 30 minutos" value="' + esc(draft.name) + '"></div>' +
      '<div class="field"><span class="lbl">Icono</span><div class="choices">' + HABIT_ICONS.map(function (i) { return '<button type="button" class="choice" data-icon="' + i + '" aria-label="' + i + '" aria-pressed="' + (draft.icon === i) + '">' + icon(i) + '</button>'; }).join("") + '</div></div>' +
      '<div class="field"><span class="lbl">Frecuencia</span><div class="choices">' + fq.map(function (f) { return '<button type="button" class="choice" data-freq="' + f[0] + '" aria-pressed="' + (draft.freq === f[0]) + '">' + f[1] + '</button>'; }).join("") + '</div></div>' +
      (draft.freq === "days"
        ? '<div class="field"><span class="lbl">Qué días</span><div class="choices">' + [1, 2, 3, 4, 5, 6, 0].map(function (d) { return '<button type="button" class="choice day" data-day="' + d + '" aria-pressed="' + draft.days.includes(d) + '">' + WD[d] + '</button>'; }).join("") + '</div></div>'
        : '<div class="field"><span class="lbl">Cuántas veces ' + (draft.freq === "week" ? "por semana" : "por mes") + '</span><div class="stepper"><button type="button" data-step="-1" aria-label="Menos">−</button><b>' + draft.times + '</b><button type="button" data-step="1" aria-label="Más">+</button></div></div>') +
      '<div class="field"><span class="lbl">Dificultad</span><div class="choices">' + [10, 20, 30].map(function (x) { return '<button type="button" class="choice" data-xp="' + x + '" aria-pressed="' + (draft.xp === x) + '">' + DIFF[x] + ' · ' + x + ' XP</button>'; }).join("") + '</div></div>' +
      '<p class="hint" id="formErr" hidden></p>' +
      '<div class="btn-row" style="margin-top:8px"><button type="submit" class="btn primary">' + (asGoal ? "Crear objetivo" : editing ? "Guardar" : "Crear hábito") + '</button><button type="button" class="btn ghost" data-close>Cancelar</button>' +
      (editing ? '<button type="button" class="btn danger" data-del style="margin-left:auto">Eliminar</button>' : "") + '</div></form>';
  }
  draw();
  if (!editing && !preset) setTimeout(function () { const n = $("#hName", bg); if (n) n.focus(); }, 50);

  bg.onclick = function (e) {
    if (e.target === bg || e.target.closest("[data-close]")) return closeSheet();
    const ic = e.target.closest("[data-icon]"), dy = e.target.closest("[data-day]"), xp = e.target.closest("[data-xp]"),
      fq = e.target.closest("[data-freq]"), sp = e.target.closest("[data-step]"), del = e.target.closest("[data-del]");
    if (ic || dy || xp || fq || sp) {
      draft.name = $("#hName", bg).value;
      if (ic) draft.icon = ic.dataset.icon;
      if (dy) { const d = +dy.dataset.day; draft.days = draft.days.includes(d) ? draft.days.filter(function (x) { return x !== d; }) : draft.days.concat(d); }
      if (xp) draft.xp = +xp.dataset.xp;
      if (fq) { draft.freq = fq.dataset.freq; draft.times = Math.min(draft.times, maxTimes()); }
      if (sp) draft.times = Math.max(1, Math.min(maxTimes(), draft.times + +sp.dataset.step));
      draw();
    }
    if (del) {
      if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "¿Seguro? Toca otra vez"; return; }
      state.habits = state.habits.filter(function (x) { return x.id !== h.id; });
      Object.keys(state.log).forEach(function (k) { state.log[k] = state.log[k].filter(function (id) { return id !== h.id; }); if (!state.log[k].length) delete state.log[k]; });
      save(); closeSheet(); render(); toast("Hábito eliminado");
    }
  };
  bg.onsubmit = function (e) {
    e.preventDefault();
    const name = $("#hName", bg).value.trim(), err = $("#formErr", bg);
    draft.name = name;
    if (!name) { err.textContent = "Escribe un nombre para el hábito."; err.hidden = false; return; }
    if (draft.freq === "days" && !draft.days.length) { err.textContent = "Elige al menos un día."; err.hidden = false; return; }
    const fields = { name: name, icon: draft.icon, freq: draft.freq, days: draft.days.sort(), times: draft.times, xp: draft.xp };
    if (asGoal) {
      const btn = bg.querySelector('[type="submit"]'); btn.disabled = true;
      const gid = "g" + uid() + uid();
      cloud.fb.F.setDoc(fdoc("groups/" + state.groupId + "/goals/" + gid), Object.assign({ title: name, createdBy: session.uid, createdAt: Date.now() }, fields))
        .then(function () {
          state.habits.push(Object.assign({ id: uid(), goalId: gid }, fields));
          save(); closeSheet(); render(); toast("Objetivo creado");
        }, function () { btn.disabled = false; err.textContent = "No se pudo crear. Revisa tu conexión e inténtalo de nuevo."; err.hidden = false; });
      return;
    }
    if (editing) Object.assign(h, fields);
    else state.habits.push(Object.assign({ id: uid() }, fields));
    save(); closeSheet(); render(); toast(editing ? "Guardado" : "Hábito creado");
  };
}
function closeSheet() { const bg = $("#sheet"); bg.hidden = true; bg.innerHTML = ""; }
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

/* ---------- Acciones ---------- */
let resetArmed = false;
function copyText(text) {
  const fallback = function () { toast("No se pudo copiar: " + text); };
  try { navigator.clipboard.writeText(text).then(function () { toast("Enlace copiado"); }, fallback); } catch (e) { fallback(); }
}
document.addEventListener("click", async function (e) {
  const goBtn = e.target.closest("[data-go]");
  if (goBtn) return go(goBtn.dataset.go);

  const tg = e.target.closest("[data-toggle]");
  if (tg) {
    const h = habitById(tg.dataset.toggle), k = key(today());
    const arr = state.log[k] || (state.log[k] = []);
    const before = levelInfo(totalXp()).level;
    if (arr.includes(h.id)) {
      state.log[k] = arr.filter(function (id) { return id !== h.id; });
      if (!state.log[k].length) delete state.log[k];
      state.coins = Math.max(0, state.coins - 1);
    } else {
      arr.push(h.id); state.coins += 1;
      const after = levelInfo(totalXp()).level;
      toast(after > before ? "¡Subiste a nivel " + after + "!" : "+" + h.xp + " XP · +1 moneda");
    }
    save(); render(); return;
  }

  const ed = e.target.closest("[data-edit]");
  if (ed) return openSheet(habitById(ed.dataset.edit));

  const sg = e.target.closest("[data-suggest]");
  if (sg) return openSheet(null, false, SUGGESTIONS[+sg.dataset.suggest]);

  const jg = e.target.closest("[data-joingoal]");
  if (jg) {
    const g = cloud.goals.find(function (x) { return x.id === jg.dataset.joingoal; });
    if (!g || state.habits.some(function (h) { return h.goalId === g.id; })) return;
    const gh = normalize({ habits: [g] }).habits[0];
    state.habits.push({
      id: uid(), goalId: g.id, name: String(g.name || g.title || "Objetivo").slice(0, 60),
      icon: HABIT_ICONS.includes(g.icon) ? g.icon : "star", freq: gh.freq,
      days: gh.days.filter(function (d) { return d >= 0 && d <= 6; }), times: Math.max(1, Math.min(30, gh.times | 0)),
      xp: [10, 20, 30].includes(g.xp) ? g.xp : 20
    });
    save(); render(); toast("Te uniste al objetivo"); return;
  }
  const dg = e.target.closest("[data-delgoal]");
  if (dg) {
    if (!dg.classList.contains("armed")) { dg.classList.add("armed"); dg.textContent = "¿Seguro? Toca otra vez"; return; }
    try { await cloud.fb.F.deleteDoc(fdoc("groups/" + state.groupId + "/goals/" + dg.dataset.delgoal)); toast("Objetivo eliminado"); }
    catch (err) { toast("No se pudo eliminar"); }
    return;
  }

  const cl = e.target.closest("[data-claim]");
  if (cl) {
    const q = quests().find(function (x) { return x.id === cl.dataset.claim; });
    if (!q || q.cur < q.goal || state.claimed[claimKey(q)]) return;
    state.claimed[claimKey(q)] = true;
    state.bonusXp += q.xp; state.coins += q.coins;
    save(); render(); toast("+" + q.xp + " XP · +" + q.coins + " monedas"); return;
  }

  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  if (a === "signin") signIn();
  else if (a === "signout") { await signOutNow(); }
  else if (a === "new") openSheet(null);
  else if (a === "newgoal") { if (cloud.fb && state.groupId) openSheet(null, true); }
  else if (a === "creategroup" || a === "joincode") {
    if (busy) return;
    const input = a === "creategroup" ? $("#gNameIn") : $("#codeIn");
    const v = input.value.trim();
    if (!v) { input.focus(); toast(a === "creategroup" ? "Ponle un nombre al grupo" : "Escribe el código"); return; }
    if (!state.name) state.name = (session.user && session.user.displayName) || "Sin nombre";
    busy = true; render();
    try {
      if (a === "creategroup") await createGroup(v); else await joinGroup(v);
      pendingCode = ""; toast(a === "creategroup" ? "Grupo creado. Comparte el código" : "Ya estás en el grupo");
    } catch (err) {
      toast(err && err.message === "no-existe" ? "No existe un grupo con ese código" : "No se pudo. Revisa tu conexión");
    }
    busy = false; render();
  }
  else if (a === "copylink") copyText(inviteLink(state.groupId));
  else if (a === "sharelink") {
    try { await navigator.share({ title: "Únete a mi grupo en Racha", text: "Código: " + state.groupId, url: inviteLink(state.groupId) }); } catch (err) { /* cancelado */ }
  }
  else if (a === "leave") {
    if (!act.classList.contains("armed")) { act.classList.add("armed", "danger"); act.textContent = "¿Seguro? Toca otra vez"; return; }
    await leaveGroup(); toast("Saliste del grupo");
  }
  else if (a === "fresh") { state = emptyState(state); save(); go("habitos"); toast("Listo. Crea tu primer hábito"); }
  else if (a === "demo") { state = exampleState(); save(); go("hoy"); }
  else if (a === "buyfreeze") { if (state.coins >= 30) { state.coins -= 30; state.freezes += 1; save(); render(); toast("Comodín comprado"); } }
  else if (a === "usefreeze") {
    const yk = key(addDays(today(), -1));
    if (state.freezes > 0 && !dayActive(yk)) { state.freezes -= 1; state.frozen.push(yk); save(); render(); toast("Racha protegida"); }
  }
  else if (a === "savename") { state.name = $("#nameIn").value.trim() || state.name; save(); render(); toast("Guardado"); }
  else if (a === "copy") {
    const ta = $("#exportOut");
    const fallback = function () { ta.focus(); ta.select(); toast("Texto seleccionado: cópialo"); };
    try { navigator.clipboard.writeText(ta.value).then(function () { toast("Copiado"); }, fallback); } catch (err) { fallback(); }
  }
  else if (a === "import") {
    try {
      const s = JSON.parse($("#importIn").value);
      if (!s || s.v !== 1 || !Array.isArray(s.habits) || typeof s.log !== "object") throw new Error();
      state = Object.assign(normalize(s), { groupId: state.groupId }); save(); go("hoy"); toast("Copia restaurada");
    } catch (err) { toast("Ese texto no es una copia válida"); }
  }
  else if (a === "reset") {
    if (!resetArmed) { resetArmed = true; act.classList.add("armed"); act.textContent = "¿Seguro? Toca otra vez"; setTimeout(function () { resetArmed = false; if (act.isConnected) { act.classList.remove("armed"); act.textContent = "Borrar todo"; } }, 4000); return; }
    resetArmed = false; state = emptyState(state); save(); go("hoy"); toast("Todo borrado");
  }
});

/* ---------- Inicio ---------- */
const hash = (location.hash || "").replace("#", "");
if (/^unirse-[A-Za-z0-9]+$/.test(hash)) { pendingCode = hash.slice(7).toUpperCase(); route = "grupo"; }
else if (pages[hash]) route = hash;
paintIcons(document);
if (session.mode === "local") {
  state = readLocal() || exampleState();
  go(route);
} else {
  state = emptyState();
  render();
  initFirebase().catch(function () {
    session.phase = "login"; session.error = "No se pudo cargar el inicio de sesión. Revisa tu conexión y recarga.";
    render();
  });
}
</script>
</body>
</html>
